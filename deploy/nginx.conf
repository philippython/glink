# nginx site for Glink (use Caddy instead if you want automatic HTTPS with no extra steps).
# HTTPS certificates: e.g. `sudo certbot --nginx -d glink.example.com` after enabling this site.
server {
    listen 80;
    server_name glink.example.com;

    # Video uploads (keep in step with MAX_UPLOAD_MB).
    client_max_body_size 500m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Live updates: server-sent events must not be buffered.
    location /api/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
